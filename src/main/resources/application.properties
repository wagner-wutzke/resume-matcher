spring.application.name=resume-matcher
spring.config.import=optional:file:.env[.properties]
spring.mongodb.host=${MONGODB_HOST:localhost}
spring.mongodb.port=${MONGODB_PORT:27017}
spring.mongodb.database=${MONGODB_DATABASE:resume_matcher}
spring.mongodb.username=${MONGODB_USERNAME:admin}
spring.mongodb.password=${MONGODB_PASSWORD:secretpassword}
spring.mongodb.authentication-database=${MONGODB_AUTHENTICATION_DATABASE:admin}

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=${CANDIDATE_MATCHING_MODEL:gpt-6-luna}
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.embedding=openai

spring.ai.vectorstore.type=qdrant
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6334}
spring.ai.vectorstore.qdrant.collection-name=${QDRANT_COLLECTION:candidate-resumes}
spring.ai.vectorstore.qdrant.initialize-schema=false
resume.ingestion.enabled=${RESUME_INGESTION_ENABLED:true}
resume.ingestion.input-directory=${RESUME_INGESTION_INPUT_DIRECTORY:/home/wagner/Documents/work/resumes}
resume.ingestion.stability-interval=${RESUME_INGESTION_STABILITY_INTERVAL:PT2S}
resume.ingestion.stability-timeout=${RESUME_INGESTION_STABILITY_TIMEOUT:PT5S}

candidate.matching.max-results=10
candidate.matching.pool-cap=20
candidate.matching.chunk-size=10
