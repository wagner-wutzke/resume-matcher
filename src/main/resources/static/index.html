<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Matcher — Candidates Matching made easy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>Resume Matcher</span>
      </a>
      <p class="app-title">Candidates Matching made easy</p>
    </header>

    <section class="workspace" aria-label="Recruitment workspace">
      <nav class="nav nav-tabs app-tabs" role="tablist" aria-label="Workspace sections">
        <button class="nav-link active" id="candidates-tab" data-bs-toggle="tab"
                data-bs-target="#candidates-panel" type="button" role="tab"
                aria-controls="candidates-panel" aria-selected="true">Candidates</button>
        <button class="nav-link" id="positions-tab" data-bs-toggle="tab"
                data-bs-target="#positions-panel" type="button" role="tab"
                aria-controls="positions-panel" aria-selected="false">Open Positions</button>
      </nav>

      <div class="tab-content workspace-content">
        <section class="tab-pane fade show active" id="candidates-panel" role="tabpanel"
                 aria-labelledby="candidates-tab" tabindex="0">
          <div class="split-view">
            <aside class="list-panel" aria-label="Candidates list">
              <div class="panel-heading"><h1>Candidates</h1></div>
              <div class="candidate-list" aria-live="polite"></div>
            </aside>
            <section class="details-panel" aria-label="Selected candidate details"></section>
          </div>
        </section>

        <section class="tab-pane fade" id="positions-panel" role="tabpanel"
                 aria-labelledby="positions-tab" tabindex="0">
          <div class="split-view">
            <aside class="list-panel" aria-label="Open positions list">
              <div class="panel-heading"><h1>Open Positions</h1></div>
              <div class="position-list" id="position-list" aria-live="polite"></div>
            </aside>
            <div class="details-column">
              <div class="details-actions" aria-label="Job-offer actions">
                <button class="btn btn-primary btn-sm" id="new-job-offer" type="button">New Job Offer</button>
                <button class="btn btn-primary btn-sm" id="edit-job-offer" type="button" hidden>Edit</button>
                <button class="btn btn-danger btn-sm" id="delete-job-offer" type="button" hidden>Delete</button>
              </div>
              <div class="alert alert-danger mx-4 mt-3" id="job-offer-delete-error" role="alert" hidden></div>
              <section class="details-panel" id="position-details"
                       aria-label="Selected position details" aria-live="polite"></section>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>
  <div class="modal fade" id="job-offer-modal" tabindex="-1" aria-hidden="true"
       aria-labelledby="job-offer-modal-title" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <form class="modal-content" id="job-offer-form" novalidate>
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="job-offer-modal-title">New Job Offer</h2>
          <button class="btn-close" id="close-job-offer-modal" type="button" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger" id="job-offer-save-error" role="alert" hidden></div>
          <div class="alert alert-warning" id="discard-confirmation" role="alertdialog"
               aria-labelledby="discard-confirmation-title" aria-describedby="discard-confirmation-copy"
               hidden>
            <h3 class="h6" id="discard-confirmation-title">Discard unsaved changes?</h3>
            <p id="discard-confirmation-copy">Your changes will be lost if you discard them.</p>
            <div class="d-flex justify-content-end gap-2">
              <button class="btn btn-outline-secondary btn-sm" id="continue-editing" type="button">Continue editing</button>
              <button class="btn btn-danger btn-sm" id="discard-changes" type="button">Discard changes</button>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="job-name">Job Name</label>
            <input class="form-control" id="job-name" name="jobName" type="text" aria-describedby="job-name-error">
            <div class="invalid-feedback" id="job-name-error" hidden>Required.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="job-description">Job Description</label>
            <textarea class="form-control" id="job-description" name="jobDescription" rows="4" aria-describedby="job-description-error"></textarea>
            <div class="invalid-feedback" id="job-description-error" hidden>Required.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="required-qualifications">Required Qualifications</label>
            <textarea class="form-control" id="required-qualifications" name="requiredQualifications" rows="4" aria-describedby="required-qualifications-error"></textarea>
            <div class="invalid-feedback" id="required-qualifications-error" hidden>Required.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="job-location">Location</label>
            <input class="form-control" id="job-location" name="location" type="text" aria-describedby="job-location-error">
            <div class="invalid-feedback" id="job-location-error" hidden>Required.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="job-allocation">Allocation</label>
            <select class="form-select" id="job-allocation" name="allocation">
              <option value="">Choose allocation</option>
              <option value="Remote">Remote</option>
              <option value="Hybrid">Hybrid</option>
              <option value="On-site">On-site</option>
            </select>
            <div class="invalid-feedback" id="job-allocation-error" hidden>Required.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="cancel-job-offer" type="button">Cancel</button>
          <button class="btn btn-primary" id="save-job-offer" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
